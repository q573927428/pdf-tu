source_root: "F:\\ipkaishi\\zhixiaoman\\幼升小.zip\\幼升小"
output_root: "./output"
grade: "幼升小"
semester: "全册"
watermark:
  enabled: true
  text: "幼升小"
  opacity: 90
  position: "bottom_right"
  font_size: 28
render:
  dpi: 150
  max_pages: 5
processing:
  # 前期测试建议设置为 10~20；正式全量运行改为 null
  max_pdfs: 20
table:
  xlsx: "pdf_catalog.xlsx"
  csv: "pdf_catalog.csv"
  include_metadata_title: false
# 豆包 Ark（OpenAI 兼容接口）。默认关闭；开启后使用 --generate-copy/--generate-cover。
ai:
  enabled: false # 是否启用豆包 API；未配置完成时请保持 false
  endpoint: "https://ark.cn-beijing.volces.com/api/v3" # 文案和封面图接口基础地址
  api_key: "" # 豆包 API Key，建议使用环境变量或本地私密配置
  model: "" # 兼容旧配置：未单独指定时，文案和图片共用此模型
  copy_model: "" # 文案模型接入点 ID；留空则使用 model
  image_model: "" # 图片生成模型接入点 ID（如 Seedream）；留空则使用 model
  generate_copy: false # 是否在运行时自动生成营销文案
  generate_cover: false # 是否在运行时自动生成封面图链接
  timeout: 60 # API 请求超时时间（秒）
  image_size: "1024x1536" # 封面图尺寸，竖版建议使用该比例
